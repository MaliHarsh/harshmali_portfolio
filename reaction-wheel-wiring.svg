<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" role="img"><title>Reaction wheel / logical wiring</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#356ba7"/></marker></defs><rect width="1100" height="790" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#001e44}.title{font-size:29px;font-weight:bold}.sub{font-size:15px;fill:#52647c}.label{font-size:18px;font-weight:bold}.small{font-size:14px}.wire{fill:none;stroke:#356ba7;stroke-width:2.5;marker-end:url(#arrow)}.power{fill:none;stroke:#b85035;stroke-width:3}.ground{fill:none;stroke:#677589;stroke-width:2;stroke-dasharray:6 5}</style><text x="40" y="48" class="title">Reaction wheel / logical wiring</text><text x="40" y="78" class="sub">Reference architecture · illustrative connections · not a pin-level build schematic</text><rect x="40" y="170" width="230" height="145" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="58" y="202" class="label">MPU6050 IMU</text><text x="58" y="231" class="small">Tilt + angular-rate sensing</text><text x="58" y="254" class="small">SDA / SCL ↔ I²C</text><text x="58" y="277" class="small">Supply per breakout rating</text><rect x="425" y="170" width="240" height="145" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="443" y="202" class="label">Arduino controller</text><text x="443" y="231" class="small">Reads estimated state</text><text x="443" y="254" class="small">Runs feedback controller</text><text x="443" y="277" class="small">Embedded feedback control</text><rect x="825" y="170" width="235" height="145" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="843" y="202" class="label">Motor driver</text><text x="843" y="231" class="small">PWM / direction interface*</text><text x="843" y="254" class="small">VM / GND supply</text><text x="843" y="277" class="small">Current rating to verify</text><rect x="825" y="440" width="235" height="115" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="843" y="472" class="label">Wheel motor</text><text x="843" y="501" class="small">Driver output → motor</text><text x="843" y="524" class="small">Wheel actuation</text><rect x="40" y="440" width="270" height="115" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="58" y="472" class="label">Regulated logic supply</text><text x="58" y="501" class="small">Matched to board + sensor</text><text x="58" y="524" class="small">Level shift I²C if required</text><rect x="410" y="440" width="280" height="115" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="428" y="472" class="label">Motor power supply</text><text x="428" y="501" class="small">Voltage + current to match</text><text x="428" y="524" class="small">Fused / switched supply</text><path class="wire" d="M270 228 H425"/><text x="293" y="212" class="small">I²C bus</text><path class="wire" d="M665 228 H825"/><text x="694" y="207" class="small">PWM / DIR*</text><path class="wire" d="M942 315 V440"/><text x="957" y="382" class="small">Motor leads</text><path class="power" d="M174 440 V360 H105 V315 M174 360 H520 V315"/><path class="power" d="M690 490 H760 V280 H825"/><path class="ground" d="M120 555 V615 H970 V555 M548 615 V555"/><text x="365" y="640" class="small">Common reference ground for all connected circuits</text><text x="40" y="701" class="sub">*Driver interface is illustrative. Confirm actual driver, voltage levels, polarity, protection, and GPIO mapping.</text><text x="40" y="730" class="sub">MPU6050 silicon and breakout boards can have different power requirements. Verify the actual module.</text><text x="40" y="759" class="sub">Red = supply path · blue = signal / actuator connection · dashed gray = common ground concept</text></svg>