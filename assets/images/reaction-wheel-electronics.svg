<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" role="img"><title>Reaction wheel / electronics &amp; feedback</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#356ba7"/></marker></defs><rect width="1100" height="710" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#001e44}.title{font-size:29px;font-weight:bold}.sub{font-size:15px;fill:#52647c}.label{font-size:18px;font-weight:bold}.small{font-size:14px}.wire{fill:none;stroke:#356ba7;stroke-width:2.5;marker-end:url(#arrow)}.power{fill:none;stroke:#b85035;stroke-width:3}.ground{fill:none;stroke:#677589;stroke-width:2;stroke-dasharray:6 5}</style><text x="40" y="48" class="title">Reaction wheel / electronics &amp; feedback</text><text x="40" y="78" class="sub">Functional diagram · links electronics to the mechanical response</text><rect x="50" y="175" width="280" height="130" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="68" y="207" class="label">1 / Sense</text><text x="68" y="236" class="small">MPU6050 accelerometer</text><text x="68" y="259" class="small">and gyroscope measurements</text><rect x="430" y="175" width="280" height="130" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="448" y="207" class="label">2 / Estimate + control</text><text x="448" y="236" class="small">Arduino / embedded C++</text><text x="448" y="259" class="small">Angle estimate + feedback</text><rect x="810" y="175" width="240" height="130" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="828" y="207" class="label">3 / Apply torque</text><text x="828" y="236" class="small">Motor driver + motor</text><text x="828" y="259" class="small">Accelerate reaction wheel</text><rect x="430" y="450" width="280" height="130" rx="5" fill="#edf3fa" stroke="#7d9abc"/><text x="448" y="482" class="label">4 / Body response</text><text x="448" y="511" class="small">Opposing reaction torque</text><text x="448" y="534" class="small">Changes platform tilt</text><path class="wire" d="M330 235 H430"/><text x="345" y="216" class="small">I²C</text><path class="wire" d="M710 235 H810"/><text x="720" y="216" class="small">Command</text><path class="wire" d="M930 305 V510 H710"/><text x="785" y="492" class="small">Reaction torque</text><path class="wire" d="M430 510 H190 V305"/><text x="55" y="418" class="small">Measured tilt / rate</text><text x="50" y="647" class="sub">Controller gains, filtering, sample rate, and motor response determine closed-loop behavior.</text><text x="50" y="677" class="sub">The illustrative firmware shows how proportional correction and rate damping can work together.</text></svg>